version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  # Runs the shared install contract against the installs of uv, Ruff and ty, with stand-in
  # releases, then the installs with uv (mypy, Pyright, deptry, Griffe, twine,
  # check-wheel-contents and the Python alone) against a stand-in uv and Python: the locks, the
  # checksum modes, the scripts that run the tools and the install records.
  test-install:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Run install tests
          command: bash tests/install_test.sh
      - run:
          name: Run the uv install tests
          command: bash tests/install_tool_test.sh
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash tests/env_subst_test.sh
      - run:
          name: Run shell conventions test
          command: bash tests/shell_conventions_test.sh
  # Runs the command scripts, with PARAM_* set from each command's YAML, against stand-ins for
  # every tool (Ruff, ty, Pyright, uv, twine and check-wheel-contents as programs; mypy, deptry,
  # Griffe, pytest and coverage.py as Python modules), in a git repository with an origin, and
  # checks every run record against the schema. Then checks that each command's YAML passes every
  # parameter its script reads. The helper runs for real, on the image's Python 3.13.
  test-commands:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install jsonschema
          command: pip install --quiet jsonschema==4.26.0
      - run:
          name: Run command tests
          command: bash tests/commands_test.sh
      - run:
          name: Run wiring test
          command: bash tests/wiring_test.sh
  # Checks that every command has a GitHub Action that takes the same inputs and runs the same
  # scripts, and tests actions/run_script.sh, which runs the scripts on GitHub Actions.
  test-actions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run GitHub Actions tests
          command: bash tests/actions_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-env-subst:
          filters: *filters
      - test-commands:
          filters: *filters
      - test-actions:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: python-quality
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: python-quality-orb
          requires: [test-install, test-env-subst, test-commands, test-actions, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
