name: Type-check Python with ty
description: >
  Type-checks Python code with ty, Astral's type checker (in beta), against the
  packages installed in the project's environment, and the environment's Python
  version unless ty's configuration (ty.toml or [tool.ty] in pyproject.toml)
  sets python-version. Diagnostics at or above fail_on are findings, which fail
  the step unless report_only is true; a run that couldn't complete, or that
  found no Python file, fails it either way. The job's TY_* variables and a
  user-level ty configuration are ignored. Writes the findings as JSON, SARIF
  and JUnit. Run the install action (tools: ty) first. The GitHub Actions twin
  of the orb's ty command.
author: juburr

inputs:
  working_dir:
    description: >
      The directory to run in. paths, environment and config are relative to it.
    default: .
  paths:
    description: >
      The files and directories to check, separated by commas or spaces. Leave empty
      for ty's default: the project, as its include and exclude settings select.
    default: ""
  environment:
    description: >
      The project's environment, with its dependencies installed: a directory such
      as .venv, or an interpreter such as .venv/bin/python, relative to the working
      directory. Create it in an earlier step, such as with uv sync, poetry install,
      or python -m venv and pip install.
    default: .venv
  config:
    description: >
      A ty configuration file (ty.toml) to use instead of the one ty finds.
    default: ""
  fail_on:
    description: >
      The lowest severity that is a finding, warning by default as ty's own
      error-on-warning. Every diagnostic is reported.
    default: warning
  allow_empty:
    description: >
      Pass when ty finds no Python file to check, instead of failing.
    default: "false"
  extra_args:
    description: >
      Further options for ty check, such as --python-version=3.12 or
      --error=possibly-unresolved-reference. They are split like shell words, but
      nothing in them is expanded or run. Options the command sets itself, and those
      that would change files, the exit code or the output it reads, are refused.
    default: ""
  report_name:
    description: >
      The reports' file name without its extension: <report_name>.json (ty's
      diagnostics) and <report_name>.sarif. Letters, digits, '.', '_' and '-'.
    default: ty
  output_dir:
    description: >
      Absolute path of the directory to write the reports into.
    default: /tmp/python-quality-reports
  junit:
    description: >
      Write the findings as JUnit (output_dir/junit/<report_name>.xml).
    default: "true"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): what was checked,
      with which tool and settings, and what it found.
    default: "false"
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually. A
      check that couldn't run, or that checked nothing, still fails it.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact named
      python-quality-reports-<report_name>-<random>, including when the step fails.
    default: "true"

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=python-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: ty
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_ALLOW_EMPTY: ${{ inputs.allow_empty }}
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_ENVIRONMENT: ${{ inputs.environment }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FAIL_ON: ${{ inputs.fail_on }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PATHS: ${{ inputs.paths }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/ty.sh"
        "SCRIPT_PYTHON_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/python_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
