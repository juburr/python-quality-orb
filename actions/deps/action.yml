name: Check Python dependencies with deptry
description: >
  Checks a Python project's declared dependencies against its imports with
  deptry: imports no dependency provides (DEP001), dependencies nothing imports
  (DEP002), imports of packages only installed through another dependency
  (DEP003), development dependencies imported by the project's code (DEP004),
  and standard library modules declared as dependencies (DEP005). deptry runs on
  the project environment's Python, so the project's installed packages and
  Python version decide what each import resolves to. Each violation is a
  finding, which fails the step unless report_only is true; a run that couldn't
  complete fails it either way. Writes the findings as JSON, SARIF and JUnit.
  Run the install action (tools: deptry) first. The GitHub Actions twin of the
  orb's deps command.
author: juburr

inputs:
  working_dir:
    description: >
      The project's root, to run in. paths, environment and config are relative to
      it.
    default: .
  paths:
    description: >
      The directories whose Python files deptry reads for imports, separated by
      commas or spaces. Leave empty for the working directory.
    default: ""
  environment:
    description: >
      The project's environment, with its dependencies installed: a directory such
      as .venv, or an interpreter such as .venv/bin/python, relative to the working
      directory. Create it in an earlier step, such as with uv sync, poetry install,
      or python -m venv and pip install.
    default: .venv
  config:
    description: >
      The pyproject.toml that declares the dependencies and holds deptry's
      configuration ([tool.deptry]). Leave empty for pyproject.toml in the working
      directory.
    default: ""
  allow_empty:
    description: >
      Pass when deptry finds no Python file to read, instead of failing.
    default: "false"
  extra_args:
    description: >
      Further long options for deptry, such as --per-rule-ignores=DEP002=uvicorn or
      --known-first-party=mypackage. They are split like shell words, but nothing in
      them is expanded or run. Options the command sets itself, and those that
      report elsewhere, are refused.
    default: ""
  report_name:
    description: >
      The reports' file name without its extension: <report_name>.json (deptry's
      violations) and <report_name>.sarif. Letters, digits, '.', '_' and '-'.
    default: deps
  output_dir:
    description: >
      Absolute path of the directory to write the reports into.
    default: /tmp/python-quality-reports
  junit:
    description: >
      Write the findings as JUnit (output_dir/junit/<report_name>.xml).
    default: "true"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): what was checked,
      with which tool and settings, and what it found.
    default: "false"
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually. A
      check that couldn't run, or that checked nothing, still fails it.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact named
      python-quality-reports-<report_name>-<random>, including when the step fails.
    default: "true"

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=python-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: deptry
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_ALLOW_EMPTY: ${{ inputs.allow_empty }}
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_ENVIRONMENT: ${{ inputs.environment }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PATHS: ${{ inputs.paths }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/deps.sh"
        "SCRIPT_PYTHON_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/python_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
