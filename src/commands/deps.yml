description: >
  Checks a Python project's declared dependencies against its imports with
  deptry: imports no dependency provides (DEP001), dependencies nothing
  imports (DEP002), imports of packages only installed through another
  dependency (DEP003), development dependencies imported by the project's
  code (DEP004), and standard library modules declared as dependencies
  (DEP005). deptry runs on the project environment's Python, so the
  project's installed packages and Python version decide what each import
  resolves to. Each violation is a finding, which fails the step unless
  report_only is true; a run that couldn't complete fails it either way.
  Writes the findings as JSON, SARIF and JUnit. Run install (tools: deptry)
  first.
parameters:
  working_dir:
    type: string
    default: "."
    description: The project's root, to run in. paths, environment and config are relative to it.
  paths:
    type: string
    default: ""
    description: >
      The directories whose Python files deptry reads for imports, separated
      by commas or spaces. Leave empty for the working directory. Environment
      variables are expanded.
  environment:
    type: string
    default: ".venv"
    description: >
      The project's environment, with its dependencies installed: a
      directory such as .venv, or an interpreter such as .venv/bin/python,
      relative to the working directory. Create it in an earlier step, such
      as with uv sync, poetry install, or python -m venv and pip install.
      Environment variables are expanded.
  config:
    type: string
    default: ""
    description: >
      The pyproject.toml that declares the dependencies and holds deptry's
      configuration ([tool.deptry]). Leave empty for pyproject.toml in the
      working directory. Environment variables are expanded.
  allow_empty:
    type: boolean
    default: false
    description: Pass when deptry finds no Python file to read, instead of failing.
  extra_args:
    type: string
    default: ""
    description: >
      Further long options for deptry, such as --per-rule-ignores=DEP002=uvicorn
      or --known-first-party=mypackage. They are split like shell words, but
      nothing in them is expanded or run. Options the command sets itself,
      and those that report elsewhere, are refused. Environment variables are
      expanded.
  report_name:
    type: string
    default: deps
    description: >
      The reports' file name without its extension: <report_name>.json
      (deptry's violations) and <report_name>.sarif. Letters, digits, '.',
      '_' and '-'.
  output_dir:
    type: string
    default: /tmp/python-quality-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  junit:
    type: boolean
    default: true
    description: >
      Write the findings as JUnit (output_dir/junit/<report_name>.xml), and
      store it with store_test_results for CircleCI's Tests tab.
  run_record:
    type: boolean
    default: false
    description: >
      Also write a run record (<report_name>.run-record.json): what was
      checked, with which tool and settings, and what it found.
  report_only:
    type: boolean
    default: false
    description: >
      Report findings without failing the step, to adopt the check
      gradually. A check that couldn't run, or that checked nothing, still
      fails it.
  store_artifacts:
    type: boolean
    default: true
    description: Store output_dir as job artifacts under python-quality-reports/, including when the step fails.
steps:
  - run:
      name: deptry (<< parameters.report_name >>)
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_ALLOW_EMPTY: << parameters.allow_empty >>
        PARAM_CONFIG: << parameters.config >>
        PARAM_ENVIRONMENT: << parameters.environment >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PATHS: << parameters.paths >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        SCRIPT_PYTHON_QUALITY_LIB: << include(scripts/lib/python_quality.sh) >>
      command: << include(scripts/deps.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: python-quality-reports
            when: always
