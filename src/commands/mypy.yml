description: >
  Type-checks Python code with mypy, against the packages installed in the
  project's environment, and the environment's Python version unless mypy's
  configuration sets python_version. Errors are findings, which fail the
  step unless report_only is true; notes are reported; a run mypy stopped
  (a syntax error, a configuration or plugin it can't use, no files) fails
  it either way. Writes the findings as JSON, SARIF and JUnit. Run install
  (tools: mypy) first, or set runner to project.
parameters:
  working_dir:
    type: string
    default: "."
    description: The directory to run in. paths, environment and config are relative to it.
  paths:
    type: string
    default: ""
    description: >
      The files and directories to check, separated by commas or spaces.
      Leave empty for the files in mypy's configuration (files, packages or
      modules), or else the working directory. Environment variables are
      expanded.
  environment:
    type: string
    default: ".venv"
    description: >
      The project's environment, with its dependencies installed: a
      directory such as .venv, or an interpreter such as .venv/bin/python,
      relative to the working directory. Create it in an earlier step, such
      as with uv sync, poetry install, or python -m venv and pip install.
      Environment variables are expanded.
  config:
    type: string
    default: ""
    description: >
      A mypy configuration file to use instead of the one mypy finds
      (mypy.ini, .mypy.ini, [tool.mypy] in pyproject.toml, [mypy] in
      setup.cfg). Environment variables are expanded.
  runner:
    type: enum
    enum: ["orb", "project"]
    default: orb
    description: >
      orb runs the mypy this orb's install verified, told where the
      project's environment is. project runs the mypy installed in the
      project's environment, which a configuration that loads plugins (such
      as pydantic.mypy or the Django stubs' plugin) needs, since plugins are
      imported into mypy's own process.
  extra_args:
    type: string
    default: ""
    description: >
      Further options for mypy, such as --strict or --exclude=build/. They
      are split like shell words, but nothing in them is expanded or run.
      Options the command sets itself, and those that would change the
      output it reads, check code given as text or install packages, are
      refused. Environment variables are expanded.
  report_name:
    type: string
    default: mypy
    description: >
      The reports' file name without its extension: <report_name>.json
      (mypy's errors and notes) and <report_name>.sarif. Letters, digits,
      '.', '_' and '-'.
  output_dir:
    type: string
    default: /tmp/python-quality-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  junit:
    type: boolean
    default: true
    description: >
      Write the findings as JUnit (output_dir/junit/<report_name>.xml), and
      store it with store_test_results for CircleCI's Tests tab.
  run_record:
    type: boolean
    default: false
    description: >
      Also write a run record (<report_name>.run-record.json): what was
      checked, with which tool and settings, and what it found.
  report_only:
    type: boolean
    default: false
    description: >
      Report findings without failing the step, to adopt the check
      gradually. A check that couldn't run, or that checked nothing, still
      fails it.
  store_artifacts:
    type: boolean
    default: true
    description: Store output_dir as job artifacts under python-quality-reports/, including when the step fails.
steps:
  - run:
      name: mypy (<< parameters.report_name >>)
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_CONFIG: << parameters.config >>
        PARAM_ENVIRONMENT: << parameters.environment >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PATHS: << parameters.paths >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        PARAM_RUNNER: << parameters.runner >>
        SCRIPT_PYTHON_QUALITY_LIB: << include(scripts/lib/python_quality.sh) >>
        SCRIPT_PYTHON_QUALITY_PY: << include(scripts/lib/python_quality.py) >>
      command: << include(scripts/mypy.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: python-quality-reports
            when: always
